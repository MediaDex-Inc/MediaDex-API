info:
  name: Update Me
  type: http
  seq: 2

http:
  method: PATCH
  url: "{{basePath}}/users/me"
  body:
    type: json
    data: |-
      {
        "email": "newemail@example.com",
        "username": "newusername",
        "password": "newpassword"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
